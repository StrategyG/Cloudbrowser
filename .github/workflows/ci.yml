name: Verify Cloudbrowser
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock -e '.[dev,studio]'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check .
      - run: node --check cloudbrowser/static/app.js
      - run: node --check cloudbrowser/static/morphglb-bridge.js
      - run: node --check cloudbrowser/static/copilot.js
      - run: python scripts/check_morphglb_scripts.py
      - run: python -m pytest -q
        env:
          CLOUDBROWSER_TEST_BROWSER: '1'
      - run: python scripts/smoke_a2a.py
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r services/studio_v4/requirements.lock
      - run: python -m pytest -q tests
        working-directory: services/studio_v4
      - run: docker compose -f compose.yaml -f compose.studio.yaml config -q
        env:
          STUDIO_API_TOKEN: ci-only-placeholder-token-at-least-32-characters
      - run: docker build -t cloudbrowser-studio services/studio_v4
      - name: Parse Godot project in built image
        run: docker run --rm --entrypoint python cloudbrowser-studio scripts/check_godot.py
      - name: Real external GLB to Blender/Godot MP4 smoke test
        run: |
          mkdir -p /tmp/cloudbrowser-studio-smoke
          chmod 777 /tmp/cloudbrowser-studio-smoke
          docker run --rm --shm-size=1g -e STUDIO_DATA_ROOT=/ci-output \
            -v /tmp/cloudbrowser-studio-smoke:/ci-output \
            --entrypoint python cloudbrowser-studio scripts/smoke_glb_render.py
      - name: Upload synthetic GLB pipeline acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-glb-smoke-evidence
          path: |
            /tmp/cloudbrowser-studio-smoke/smoke_output.mp4
            /tmp/cloudbrowser-studio-smoke/smoke_preview.png
            /tmp/cloudbrowser-studio-smoke/smoke_report.json
          if-no-files-found: warn
          retention-days: 7
  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: knowledge
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U rag -d knowledge"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]>=3.2,<4' 'pgvector>=0.4,<0.5'
      - name: Real vector retrieval + project scoping
        run: python scripts/smoke_pgvector.py
        env:
          RAG_TEST_DB_URL: postgresql://rag:ci-test-only-password@localhost:5439/knowledge
      - name: Verify optional Docker configuration
        run: docker compose -f compose.yaml -f compose.knowledge.yaml --profile knowledge config -q
        env:
          RAG_API_TOKEN: ci-only-private-token-with-32-characters
          RAG_DB_PASSWORD: ci-only-db-pass
          RAG_EMBEDDING_DIR: /tmp
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
      - name: Container CLI and sandboxed Chromium smoke test
        run: |
          docker compose run --rm cloudbrowser --help
          docker compose run --rm --entrypoint python cloudbrowser /app/scripts/smoke_browser.py
