services:
  cloudbrowser:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLOUDBROWSER_PUBLIC_ORIGIN: ${CLOUDBROWSER_PUBLIC_ORIGIN:-}
    volumes:
      - cloudbrowser_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 1gb
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/seccomp_profile.json
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cloudbrowser_data:
