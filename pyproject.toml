[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudbrowser"
version = "0.4.0"
description = "Self-hosted browser and video agent controlled from Telegram"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx[socks]==0.28.1",
  "playwright==1.64.1",
  "Pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]
studio = ["numpy==2.5.4", "trimesh==4.12.2", "networkx==3.7", "python-multipart==0.0.32"]

[project.scripts]
cloudbrowser = "cloudbrowser.__main__:main"

[tool.setuptools.package-data]
cloudbrowser = ["static/*", "morphglb/*"]

[tool.setuptools.packages.find]
include = ["cloudbrowser*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: requires installed Playwright Chromium", "media: requires FFmpeg"]

[tool.ruff]
extend-exclude = ["services/studio_v4"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
